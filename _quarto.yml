project:
  type: book
  output-dir: _book

lang: zh-CN

book:
  title: "经济学随笔"
  subtitle: "Economic Essays"
  author: "作者姓名（待填写）"
  date: "2026-09-26"
  date-format: "YYYY年M月D日"
  search: true
  page-navigation: true
  reader-mode: true
  chapters:
    - index.qmd
    - preface.qmd
    - part: "第一辑：宏观经济"
      chapters:
        - essays/01-safe-assets.qmd
        - essays/02-debt-demand.qmd
    - part: "第二辑：财政与宏观政策"
      chapters:
        - essays/03-fiscal-expansion.qmd
        - essays/04-policy-consistency.qmd
    - part: "第三辑：财富与分配"
      chapters:
        - essays/05-inequality.qmd

bibliography: references.bib
citation-location: document

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    toc: true
  epub:
    toc: true

execute:
  freeze: auto
